name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "mock-api-key-for-ci"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "studyhub-mock.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "studyhub-mock"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "studyhub-mock.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef123456"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install --no-audit

      - name: Run Vitest Unit Tests (54 tests)
        run: npm test -- --reporter=verbose

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Verify Next.js Production Build
        run: npm run build
